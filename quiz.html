<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-box">

    <h1>Online Quiz System</h1>

    <p id="progress"></p>

    <h2 id="question"></h2>

    <div class="options">

        <label class="option" id="label1">
            <input type="radio" name="answer">
            <span id="op1"></span>
        </label>

        <label class="option" id="label2">
            <input type="radio" name="answer">
            <span id="op2"></span>
        </label>

        <label class="option" id="label3">
            <input type="radio" name="answer">
            <span id="op3"></span>
        </label>

        <label class="option" id="label4">
            <input type="radio" name="answer">
            <span id="op4"></span>
        </label>

    </div>

    <button onclick="nextQuestion()">Next</button>

</div>

<script src="script.js"></script>

</body>
</html>
